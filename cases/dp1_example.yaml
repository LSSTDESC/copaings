# DP1 (ComCam) ECDFS: reproduces the notebook run (tract 5063, ll=2", mag_cut=35).
name: dp1_ecdfs
out_root: /sdf/group/rubin/user/cdoux/blend_runs

repo: /repo/dp1
collections: LSSTComCam/DP1
skymap: lsst_cells_v1
